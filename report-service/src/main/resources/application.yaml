spring:
  application:
    name: bug-report-service
  mail:
    protocol: smtps
    host: smtp.yandex.ru
    port: 465
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
  servlet:
    multipart:
      location: ${java.io.tmpdir}
      max-file-size: 50MB
      max-request-size: 50MB

mail:
  from: ${EMAIL_USERNAME}@yandex.ru

feature-toggle:
  frontend-report: false

server-secret: ${SERVER_SECRET}
