server:
  forward-headers-strategy: native

spring:
  application:
    name: bug-report-service
  mail:
    protocol: smtps
    host: smtp.yandex.ru
    port: 465
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reportdb}
    username: ${DB_USERNAME:report}
    password: ${DB_PASSWORD:report}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      location: ${java.io.tmpdir}
      max-file-size: 50MB
      max-request-size: 50MB

mail:
  from: ${EMAIL_USERNAME}@yandex.ru

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.mrak-bre.ru}

telemetry:
  steam-auth:
    app-id: ${STEAM_APP_ID:5536570}
    identity: ${STEAM_TICKET_IDENTITY:mrak-telemetry}
    publisher-key: ${STEAM_PUBLISHER_KEY:}
    base-url: ${STEAM_WEB_API_URL:https://partner.steam-api.com}
    connect-timeout: 2s
    read-timeout: 5s
    token-ttl: 1h
  account-rate-limit-per-minute: ${TELEMETRY_ACCOUNT_RATE_LIMIT:100}
