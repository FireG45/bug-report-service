services:
  frontend:
    build: ../mrak-main-page
    container_name: frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env

  report-service:
    build: ./report-service
    container_name: report-service
    ports:
      - "8080:8080"
    env_file:
      - .env
