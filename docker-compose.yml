services:
  frontend:
    build: ../mrak-main-page
    container_name: frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: report-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reportdb}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - report-postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB:-reportdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  report-service:
    build: ./report-service
    container_name: report-service
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  report-postgres-data:
