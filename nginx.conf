limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=telemetry:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=report:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name mrak-bre.ru www.mrak-bre.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mrak-bre.ru www.mrak-bre.ru;

    ssl_certificate /etc/letsencrypt/live/mrak-bre.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrak-bre.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    client_body_buffer_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn perip 20;

    # телеметрия: маленькие JSON-пачки
    location /api/telemetry/ {
        limit_req zone=telemetry burst=120 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8080/telemetry/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # загрузка баг-репортов (самый тяжёлый маршрут)
    location /api/report-send {
        limit_req zone=report burst=6 nodelay;
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080/report-send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # backend API
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # фронт
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
